name: Build

# Builds both firmware variants on every push and pull request, and uploads them
# as a workflow artifact. Pushing a tag also publishes them as a GitHub release.

on:
  push:
    branches: ['**']
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  ARM_TOOLCHAIN: arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # git describe names the build, so it needs the history and tags
          fetch-depth: 0

      - name: Cache the Arm GNU Toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: ~/${{ env.ARM_TOOLCHAIN }}
          key: ${{ env.ARM_TOOLCHAIN }}

      - name: Download the Arm GNU Toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/${ARM_TOOLCHAIN}.tar.xz" \
            | tar -xJ -C ~

      - name: Build
        run: |
          export PATH="$HOME/${ARM_TOOLCHAIN}/bin:$PATH"
          arm-none-eabi-gcc --version | head -1
          version=$(git describe --abbrev=7 --dirty --always --tags)
          remote="github.com/${GITHUB_REPOSITORY}.git"
          mkdir -p dist

          make -j"$(nproc)" GIT_REMOTE="$remote"
          cp "build/canable2-${version}.bin" "dist/canable2-${version}.bin"

          make clean
          make -j"$(nproc)" GIT_REMOTE="$remote" LEDS_QUIET=1
          cp "build/canable2-${version}.bin" "dist/canable2-${version}-quiet.bin"

          cd dist
          sha256sum *.bin | tee SHA256SUMS
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: canable2-${{ env.VERSION }}
          path: dist/*

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "$tag" --notes \
              "Two builds of the same code: \`canable2-${tag}.bin\` starts with the status LEDs on, \`canable2-${tag}-quiet.bin\` with them off. Flashing is in the README."
          fi
